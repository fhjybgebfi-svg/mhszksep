<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gpyth Chat</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="main-app">
  <header class="topbar">
    <h2 id="pageTitle">Beranda</h2>
    <div>
      <button class="icon-btn" id="btnThemeToggle"><i class="bi bi-moon-stars"></i></button>
      <button class="icon-btn" id="btnSearchUser" style="display:none;"><i class="bi bi-search"></i></button>
      <button class="icon-btn" id="btnAdmin" style="display:none; color:gold;"><i class="bi bi-shield-lock-fill"></i></button>
    </div>
  </header>

  <main class="tab-content">
    <!-- BERANDA -->
    <section id="tab-beranda" class="tab-pane active">
      <!-- STORY BAR -->
      <div class="story-bar" id="storyBar">
        <div class="story-item" id="addStoryBtn" style="display:none;">
          <div class="story-avatar" style="border-color:var(--primary);"><i class="bi bi-plus-lg"></i></div>
          <span>Story</span>
        </div>
        <!-- Story orang lain muncul di sini via JS -->
      </div>
      <div id="feedContainer" class="feed-container"></div>
    </section>

    <!-- CHAT LIST -->
    <section id="tab-chat" class="tab-pane">
      <div class="chat-list" id="chatListContainer">
        <div class="chat-item" id="openHzcs">
          <div class="chat-avatar" style="background:#3b82f6; color:white;"><i class="bi bi-robot"></i></div>
          <div class="chat-info"><h4>HZCS Official</h4><p>Pusat bantuan Gpyth.</p></div>
        </div>
      </div>
    </section>

    <!-- GRUP -->
    <section id="tab-grup" class="tab-pane">
      <div style="padding:16px;" id="groupActions">
        <button class="btn btn-primary" id="btnCreateGroup"><i class="bi bi-plus-lg"></i> Buat Grup</button>
      </div>
      <div id="groupList" style="padding: 0 16px;"></div>
    </section>

    <!-- PROFIL -->
    <section id="tab-profil" class="tab-pane">
      <div id="guestProfile" style="text-align:center; padding-top:50px; display:none;">
        <h3>Kamu belum login</h3>
        <button class="btn btn-primary" onclick="window.location.href='index.html'" style="margin-top:20px; width:auto;">Login</button>
      </div>

      <div id="userProfile" style="display:none;">
        <div class="tg-banner" id="profileBanner"></div>
        <div class="tg-profile-data">
          <img id="profileAvatar" class="tg-avatar" src="https://via.placeholder.com/100">
          <div class="tg-info">
            <h2 id="profileName">Memuat...</h2>
            <p id="profileUser">@memuat</p>
            <span class="dev-badge" id="devBadge" style="display:none;">👑 DEVELOPER</span>
            <span class="tg-badge" id="premBadge" style="display:none;"><i class="bi bi-patch-check-fill"></i> Premium</span>
            
            <div class="tg-stats" style="cursor:pointer;" id="clickFollowers">
              <div><strong id="statFollower">0</strong> Pengikut</div>
              <div><strong id="statFollowing">0</strong> Mengikuti</div>
            </div>

            <div class="ig-bio"><p id="profileBio">Bio belum diisi.</p></div>

            <div class="tg-actions">
              <button class="btn btn-outline" id="btnEditProfile">Edit Profil</button>
              <button class="btn btn-primary" id="btnPremium" style="background:linear-gradient(45deg, #fbbf24, #ec4899);"><i class="bi bi-star-fill"></i> Premium</button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <button class="fab" id="fabPost" style="display: none;"><i class="bi bi-plus-lg"></i></button>

  <nav class="bottom-nav">
    <button class="nav-item active" data-tab="beranda"><i class="bi bi-house-door"></i></button>
    <button class="nav-item" data-tab="chat"><i class="bi bi-chat-dots"></i></button>
    <button class="nav-item nav-camera" id="btnCamera"><div class="camera-circle"><i class="bi bi-camera-fill"></i></div></button>
    <button class="nav-item" data-tab="grup"><i class="bi bi-people"></i></button>
    <button class="nav-item" data-tab="profil"><i class="bi bi-person"></i></button>
  </nav>

  <!-- MODALS -->
  <div class="modal-overlay" id="postModal">
    <div class="modal-content">
      <h2>Buat Postingan</h2>
      <textarea id="postText" rows="3" placeholder="Apa yang dipikirin?"></textarea>
      <input type="text" id="postLocation" placeholder="Lokasi (cth: Jakarta)" style="margin-top:10px;">
      <input type="file" id="postPhoto" accept="image/*" style="margin-top:10px;">
      <div style="display:flex; gap:8px; margin-top:15px;">
        <button class="btn btn-outline" onclick="document.getElementById('postModal').classList.remove('active')">Batal</button>
        <button class="btn btn-primary" id="btnSubmitPost">Posting</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="editProfileModal">
    <div class="modal-content">
      <h2>Edit Profil</h2>
      <input type="file" id="editAvatar" accept="image/*" style="margin-bottom:10px;">
      <input type="file" id="editBanner" accept="image/*" style="margin-bottom:10px;">
      <input type="text" id="editName" placeholder="Nama" style="margin-bottom:10px;">
      <textarea id="editBio" placeholder="Bio" rows="2" style="margin-bottom:10px;"></textarea>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-outline" onclick="document.getElementById('editProfileModal').classList.remove('active')">Batal</button>
        <button class="btn btn-primary" id="btnSaveProfile">Simpan</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="commentModal">
    <div class="modal-content">
      <h2>Komentar</h2>
      <div id="commentList" style="max-height:200px; overflow-y:auto; margin-bottom:10px;"></div>
      <div style="display:flex; gap:8px;">
        <input type="text" id="commentInput" placeholder="Ketik komentar..." style="flex:1;">
        <button class="btn btn-primary" id="btnSendComment" style="width:auto;">Kirim</button>
      </div>
      <button class="btn btn-outline" onclick="document.getElementById('commentModal').classList.remove('active')" style="margin-top:10px;">Tutup</button>
    </div>
  </div>

  <div class="modal-overlay" id="searchModal">
    <div class="modal-content">
      <h2>Cari Pengguna</h2>
      <input type="text" id="searchInput" placeholder="Cari username..." style="margin-bottom:10px;">
      <div id="searchResults" style="max-height:200px; overflow-y:auto;"></div>
      <button class="btn btn-outline" onclick="document.getElementById('searchModal').classList.remove('active')" style="margin-top:10px;">Tutup</button>
    </div>
  </div>

  <div class="modal-overlay" id="premiumModal">
    <div class="modal-content">
      <h2 style="color:gold; text-align:center;"><i class="bi bi-star-fill"></i> Gpyth Premium</h2>
      <p style="text-align:center; font-size:12px; margin-bottom:15px;">Dapatkan Centang Biru, Banner Estetik, Emoji iPhone, & Story!</p>
      <button class="btn btn-outline" id="btnClaimTrial" style="color:#22c55e; border-color:#22c55e;">Klaim Trial 100% (1x per HP)</button>
      <button class="btn btn-outline" onclick="document.getElementById('premiumModal').classList.remove('active')" style="margin-top:10px;">Tutup</button>
    </div>
  </div>

  <!-- STORY VIEWER -->
  <div class="modal-overlay" id="storyViewer" style="background:#000;">
    <div style="position:relative; width:100%; height:100%; display:flex; justify-content:center; align-items:center;">
      <img id="storyImage" style="max-width:100%; max-height:100%; object-fit:contain;">
      <button class="icon-btn" onclick="document.getElementById('storyViewer').classList.remove('active')" style="position:absolute; top:20px; right:20px; color:white; font-size:30px;"><i class="bi bi-x-lg"></i></button>
    </div>
  </div>

  <!-- CHAT OVERLAY -->
  <div id="chatOverlay" class="chat-overlay-view">
    <header class="topbar">
      <button class="icon-btn" id="btnBackChat"><i class="bi bi-arrow-left"></i></button>
      <div>
        <h2 id="chatTitle" style="font-size:16px;">Chat</h2>
        <p id="chatStatus" style="font-size:11px; color:#888; margin:0;">Offline</p>
      </div>
    </header>
    <div class="chat-messages" id="chatMessages"></div>
    <div id="emojiPicker" class="emoji-picker" style="display:none;"></div>
    <div class="chat-input-area">
      <button class="icon-btn" id="btnEmoji" style="font-size:24px; color:#fbbf24;"><i class="bi bi-emoji-smile"></i></button>
      <input type="text" id="chatInput" placeholder="Ketik pesan...">
      <button class="btn btn-primary" id="btnSendChat" style="width:auto; padding:10px 20px;"><i class="bi bi-send-fill"></i></button>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
