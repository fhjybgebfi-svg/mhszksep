<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gpyth Chat - Login</title>
  <style>
    :root { --bg: #000; --card: #121212; --border: #262626; --text: #fff; --dim: #888; --primary: #0095f6; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; height: 100vh; padding: 20px; }
    .auth-card { background: var(--card); padding: 30px; border-radius: 12px; width: 100%; max-width: 350px; border: 1px solid var(--border); text-align: center; }
    .logo-title { font-size: 32px; font-weight: 900; letter-spacing: 2px; margin-bottom: 5px; }
    .logo-tagline { font-size: 13px; color: var(--dim); margin-bottom: 25px; }
    .input-group { margin-bottom: 12px; }
    input { width: 100%; padding: 12px; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 6px; outline: none; font-size: 14px; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; margin-top: 5px; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .switch-auth { margin-top: 20px; font-size: 13px; color: var(--dim); }
    .switch-auth a { color: var(--primary); text-decoration: none; font-weight: bold; margin-left: 5px; }
    .divider { margin: 20px 0; font-size: 12px; color: var(--dim); display: flex; align-items: center; }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); margin: 0 10px; }
  </style>
</head>
<body>
  <div class="auth-card">
    <h1 class="logo-title">GPYTH</h1>
    <p class="logo-tagline">Sosmed + chat dalam satu aplikasi</p>

    <div id="loginForm">
      <div class="input-group"><input type="text" id="loginUser" placeholder="Username (tanpa @)"></div>
      <div class="input-group"><input type="password" id="loginPass" placeholder="Password"></div>
      <button class="btn btn-primary" id="btnLogin">Masuk</button>
      <p class="switch-auth">Belum punya akun? <a href="#" id="goToRegister">Daftar</a></p>
      <div class="divider">atau</div>
      <button class="btn btn-outline" id="btnGuest">Lihat sebagai Tamu</button>
    </div>

    <div id="registerForm" style="display:none;">
      <div class="input-group"><input type="text" id="regName" placeholder="Nama Lengkap"></div>
      <div class="input-group"><input type="number" id="regAge" placeholder="Umur"></div>
      <div class="input-group"><input type="text" id="regUser" placeholder="Username (tanpa @)"></div>
      <div class="input-group"><input type="password" id="regPass" placeholder="Password (min 6)"></div>
      <button class="btn btn-primary" id="btnRegister">Daftar</button>
      <p class="switch-auth">Udah punya akun? <a href="#" id="goToLogin">Masuk</a></p>
    </div>
  </div>
  
  <script type="module" src="app.js"></script>
</body>
</html>
