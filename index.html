<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gpyth Chat - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <h1 class="logo-title">GPYTH</h1>
    <p class="logo-tagline">Sosmed + chat dalam satu aplikasi</p>

    <!-- FORM LOGIN -->
    <div id="loginForm">
      <div class="input-group">
        <input type="text" id="loginUser" placeholder="Username (tanpa @)">
      </div>
      <div class="input-group">
        <input type="password" id="loginPass" placeholder="Password">
      </div>
      <button class="btn btn-primary" id="btnLogin">Masuk</button>
      <p class="switch-auth">Belum punya akun? <a href="#" id="goToRegister">Daftar</a></p>
      <button class="btn btn-outline" id="btnGuest" style="margin-top:10px;">Lihat sebagai Tamu</button>
    </div>

    <!-- FORM DAFTAR -->
    <div id="registerForm" style="display:none;">
      <div class="input-group"><input type="text" id="regName" placeholder="Nama Lengkap"></div>
      <div class="input-group"><input type="number" id="regAge" placeholder="Umur"></div>
      <div class="input-group"><input type="text" id="regUser" placeholder="Username (tanpa @)"></div>
      <div class="input-group"><input type="password" id="regPass" placeholder="Password (min 6)"></div>
      <button class="btn btn-primary" id="btnRegister">Daftar</button>
      <p class="switch-auth">Udah punya akun? <a href="#" id="goToLogin">Masuk</a></p>
    </div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
